name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    needs: pyz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -n auto -v
      - name: Download wheel and zipapp
        uses: actions/download-artifact@v8
        with:
          name: pyz
      - name: Check the isolated zipapp
        run: >-
          uv run --python ${{ matrix.python-version }} pytest tests/check_pyz.py -v
          --wheel build/wheel/*.whl --pyz dist/zfs-tenant.pyz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - name: Run pre-commit (via prek)
        uses: j178/prek-action@v1

  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Build and smoke-test the zipapp
        run: just pyz
      - name: Upload wheel and zipapp
        uses: actions/upload-artifact@v7
        with:
          name: pyz
          path: |
            build/wheel/*.whl
            dist/zfs-tenant.pyz
          if-no-files-found: error

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Expose /dev/kvm to the Nix build users before the daemon starts, so the NixOS VM
      # test runs with hardware acceleration instead of TCG emulation.
      - name: Enable KVM for VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Check flake (package, unit tests, module assertions)
        run: nix flake check --no-write-lock-file -L
      - name: Build without flakes (default.nix, locked nixpkgs)
        env:
          NIX_CONFIG: "experimental-features ="
        run: |
          rev=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          nix-build --no-out-link -I "nixpkgs=https://github.com/NixOS/nixpkgs/archive/$rev.tar.gz"
      - name: Run the two-node ZFS VM test
        run: nix build .#checks.x86_64-linux.integration --no-link --no-write-lock-file -L
