# zfs-tenant Documentation Site Configuration
# Built with Zensical - https://zensical.org
# Pages pull their content from README.md sections; run `just docs` to refresh them.

[project]
site_name = "zfs-tenant"
site_description = "Give a friend a quota-capped corner of your ZFS pool for raw encrypted backups, without giving them a shell"
site_author = "Bas Nijholt"
site_url = "https://zfs-tenant.nijho.lt/"
copyright = "Copyright &copy; 2026 Bas Nijholt"

repo_url = "https://github.com/basnijholt/zfs-tenant"
repo_name = "GitHub"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Usage" = "usage.md" },
  { "Design Goals" = "design.md" },
  { "Security Model" = "security.md" },
  { "What the Gate Allows" = "gate.md" },
  { "FAQ" = "faq.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
logo = "logo.svg"
favicon = "logo.svg"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Three-way toggle: system preference -> light -> dark -> system preference
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "blue"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/basnijholt/zfs-tenant"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/zfs-tenant/"

# Enable GitHub-style admonitions (> [!NOTE], > [!TIP], etc.)
[project.markdown_extensions.gfm_admonition]

# Enable markdown inside HTML blocks (e.g., <details>)
[project.markdown_extensions.md_in_html]

# Enable attribute lists for adding CSS classes (e.g., {.md-button})
[project.markdown_extensions.attr_list]

# Enable tables (the security model and the gate allowlist)
[project.markdown_extensions.tables]

# Permalinks on headings
[project.markdown_extensions.toc]
permalink = true

# Enable syntax highlighting for fenced code blocks
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

# Render ```mermaid fences (the "How it works" diagram)
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

# Enable tabs (=== "Tab Name" syntax)
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Enable emoji/icon support
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
